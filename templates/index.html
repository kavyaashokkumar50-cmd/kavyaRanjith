<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduGenie 🧠✨</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to EduGenie 🧠✨</h1>
        <p>Your personal AI tutor for learning support!</p>

        <!-- Q&A Section -->
        <div class="card">
            <h3>Ask EduGenie a Question</h3>
            <form id="qaForm">
                <input type="text" id="question" placeholder="Why is the sky blue?" required>
                <button type="submit">Get Answer</button>
            </form>
            <div id="qaResult" class="output"></div>
        </div>

        <!-- Explanation Section -->
        <div class="card">
            <h3>Need an Explanation?</h3>
            <form id="explainForm">
                <input type="text" id="topic" placeholder="Photosynthesis" required>
                <button type="submit">Explain</button>
            </form>
            <div id="explanationResult" class="output"></div>
        </div>

        <!-- Summary Section -->
        <div class="card">
            <h3>Summarize a Paragraph</h3>
            <form id="summaryForm">
                <input type="text" id="summaryText" placeholder="Paste long content to summarize" required>
                <button type="submit">Summarize</button>
            </form>
            <div id="summaryResult" class="output"></div>
        </div>

        <!-- Quiz Section -->
        <div class="card">
            <h3>Generate a Quiz</h3>
            <form id="quizForm">
                <input type="text" id="quizText" placeholder="Solar System or Pythagoras Theorem" required>
                <button type="submit">Generate Quiz</button>
            </form>
            <div id="quizResult" class="output"></div>
        </div>

        <!-- Learning Recommendations Section -->
        <div class="card">
            <h3>Get Learning Recommendations</h3>
            <form id="learnForm">
                <input type="text" id="learnTopic" placeholder="e.g. Linear Regression or SQL" required>
                <button type="submit">Get Recommendations</button>
            </form>
            <div id="learnResult" class="output"></div>
        </div>
    </div>

    <script>
        // Q&A handler
        document.getElementById('qaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const q = document.getElementById('question').value;
            const resDiv = document.getElementById('qaResult');
            resDiv.innerText = "Loading...";
            const response = await fetch(`/qa?question=${encodeURIComponent(q)}`);
            const data = await response.json();
            resDiv.innerText = data.answer || data.error;
        });

        // Explanation handler
        document.getElementById('explainForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const topic = document.getElementById('topic').value;
            const resDiv = document.getElementById('explanationResult');
            resDiv.innerText = "Loading...";
            const response = await fetch('/explain/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({topic})
            });
            const data = await response.json();
            resDiv.innerText = data.explanation || data.error;
        });

        // Summary handler
        document.getElementById('summaryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('summaryText').value;
            const resDiv = document.getElementById('summaryResult');
            resDiv.innerText = "Loading...";
            const response = await fetch('/summarize/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text})
            });
            const data = await response.json();
            resDiv.innerText = data.summary || data.error;
        });

        // Quiz handler
        document.getElementById('quizForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('quizText').value;
            const resDiv = document.getElementById('quizResult');
            resDiv.innerText = "Loading quiz...";
            const response = await fetch('/quiz', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text})
            });
            const data = await response.json();
            if(data.quiz && Array.isArray(data.quiz)) {
                let html = "";
                data.quiz.forEach((q, idx) => {
                    html += `<p><b>Q${idx+1}: ${q.question}</b></p>`;
                    q.options.forEach(opt => {
                        html += `<label><input type="radio" name="q${idx}" value="${opt}"> ${opt}</label><br>`;
                    });
                });
                resDiv.innerHTML = html;
            } else {
                resDiv.innerText = JSON.stringify(data);
            }
        });

        // Learning Recommendations handler
        document.getElementById('learnForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const topic = document.getElementById('learnTopic').value;
            const resDiv = document.getElementById('learnResult');
            resDiv.innerText = "Loading path...";
            const response = await fetch(`/learn/recommendations?topic=${encodeURIComponent(topic)}`);
            const data = await response.json();
            resDiv.innerText = data.recommendation || data.error;
        });
    </script>
</body>
</html>
